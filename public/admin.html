<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Luna Local · MCP 观察台</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #090d12;
      --panel: #111821;
      --panel-2: #151f2b;
      --line: #263342;
      --text: #edf4fb;
      --muted: #91a2b5;
      --cyan: #5ee6d0;
      --blue: #69a7ff;
      --green: #63dc91;
      --amber: #ffc867;
      --red: #ff7a88;
      --radius: 16px;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-width: 320px;
      min-height: 100vh;
      background:
        radial-gradient(circle at 10% -10%, rgba(94, 230, 208, .12), transparent 34%),
        radial-gradient(circle at 90% 0%, rgba(105, 167, 255, .12), transparent 30%),
        var(--bg);
      color: var(--text);
      font-family: Inter, "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
    }

    button, input, select { font: inherit; }

    .shell { width: min(1440px, calc(100% - 40px)); margin: 0 auto; padding: 28px 0 48px; }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 24px;
    }

    .brand { display: flex; align-items: center; gap: 14px; }
    .mark {
      display: grid;
      place-items: center;
      width: 44px;
      height: 44px;
      border: 1px solid rgba(94, 230, 208, .45);
      border-radius: 14px;
      background: linear-gradient(145deg, rgba(94, 230, 208, .18), rgba(105, 167, 255, .08));
      color: var(--cyan);
      font-weight: 800;
      letter-spacing: -.04em;
    }

    h1 { margin: 0; font-size: 22px; letter-spacing: -.02em; }
    .subtitle { margin: 4px 0 0; color: var(--muted); font-size: 13px; }
    .header-actions { display: flex; align-items: center; gap: 10px; }

    .live {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      border: 1px solid var(--line);
      border-radius: 999px;
      color: var(--muted);
      font-size: 13px;
      background: rgba(17, 24, 33, .75);
    }

    .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--amber); box-shadow: 0 0 0 4px rgba(255, 200, 103, .08); }
    .dot.ok { background: var(--green); box-shadow: 0 0 0 4px rgba(99, 220, 145, .08); }

    .button {
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 8px 12px;
      background: var(--panel-2);
      color: var(--text);
      cursor: pointer;
    }
    .button:hover { border-color: #3a4b60; }
    .button:disabled { cursor: not-allowed; opacity: .48; }

    .overview {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 14px;
      margin-bottom: 16px;
    }

    .card, .panel {
      border: 1px solid var(--line);
      background: linear-gradient(180deg, rgba(21, 31, 43, .94), rgba(17, 24, 33, .94));
      box-shadow: 0 18px 50px rgba(0, 0, 0, .18);
    }

    .card { min-height: 126px; padding: 18px; border-radius: var(--radius); }
    .eyebrow { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .1em; }
    .metric { margin-top: 16px; font-size: 27px; font-weight: 740; letter-spacing: -.04em; }
    .metric.small { font-size: 17px; letter-spacing: -.02em; overflow-wrap: anywhere; }
    .hint { margin-top: 6px; color: var(--muted); font-size: 12px; }

    .grid {
      display: grid;
      grid-template-columns: minmax(340px, .72fr) minmax(0, 1.28fr);
      gap: 16px;
      align-items: start;
    }

    .stack { display: grid; gap: 16px; }
    .panel { border-radius: var(--radius); overflow: hidden; }
    .panel-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 17px 18px;
      border-bottom: 1px solid var(--line);
    }
    .panel h2 { margin: 0; font-size: 15px; letter-spacing: -.01em; }
    .panel-body { padding: 16px 18px; }

    .permission { display: flex; align-items: center; justify-content: space-between; gap: 14px; padding: 12px 0; }
    .permission + .permission { border-top: 1px solid var(--line); }
    .permission-name { font-size: 14px; font-weight: 650; }
    .permission-meta { margin-top: 4px; color: var(--muted); font-size: 12px; }
    .tag { display: inline-block; margin-left: 7px; padding: 2px 6px; border-radius: 5px; background: rgba(105, 167, 255, .11); color: var(--blue); font-size: 10px; text-transform: uppercase; }
    .tag.write { background: rgba(255, 200, 103, .11); color: var(--amber); }
    .tag.execute { background: rgba(255, 122, 136, .1); color: var(--red); }

    .toggle { min-width: 66px; }
    .toggle.on { border-color: rgba(99, 220, 145, .38); background: rgba(99, 220, 145, .1); color: var(--green); }
    .toggle.off { border-color: rgba(255, 122, 136, .3); background: rgba(255, 122, 136, .08); color: var(--red); }

    .policy-list { display: grid; gap: 11px; margin: 0; }
    .policy-row { display: grid; grid-template-columns: 108px 1fr; gap: 10px; align-items: start; font-size: 13px; }
    .policy-row dt { color: var(--muted); }
    .policy-row dd { margin: 0; overflow-wrap: anywhere; }

    .approval {
      border: 1px dashed rgba(255, 200, 103, .34);
      border-radius: 12px;
      padding: 14px;
      background: rgba(255, 200, 103, .045);
    }
    .approval strong { display: block; font-size: 14px; color: var(--amber); }
    .approval p { margin: 7px 0 12px; color: var(--muted); font-size: 12px; line-height: 1.6; }
    .approval-top { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .approval-list { display: grid; gap: 9px; margin-top: 12px; }
    .approval-item { border: 1px solid var(--line); border-radius: 11px; padding: 12px; background: #0d141c; }
    .approval-summary { margin: 6px 0 10px; color: #cbd8e5; font-size: 12px; line-height: 1.5; overflow-wrap: anywhere; }
    .approval-actions { display: flex; gap: 8px; }
    .button.approve { color: var(--green); border-color: rgba(99, 220, 145, .34); }
    .button.deny { color: var(--red); border-color: rgba(255, 122, 136, .3); }

    .filters { display: flex; gap: 8px; flex-wrap: wrap; }
    .input, .select {
      height: 34px;
      border: 1px solid var(--line);
      border-radius: 9px;
      background: #0d141c;
      color: var(--text);
      padding: 0 10px;
      outline: none;
    }
    .input { width: 190px; }
    .input:focus, .select:focus { border-color: var(--blue); }

    .table-wrap { overflow: auto; max-height: 620px; }
    table { width: 100%; border-collapse: collapse; font-size: 12px; }
    th { position: sticky; top: 0; z-index: 1; background: #121b25; color: var(--muted); text-align: left; font-weight: 600; }
    th, td { padding: 11px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
    td.path { max-width: 230px; overflow-wrap: anywhere; color: #c5d4e3; }
    td.details { max-width: 260px; overflow-wrap: anywhere; color: var(--muted); }
    .status { font-weight: 700; }
    .status.success { color: var(--green); }
    .status.error { color: var(--red); }
    .status.denied { color: var(--amber); }
    .empty { padding: 40px 18px; color: var(--muted); text-align: center; }

    @media (max-width: 980px) {
      .overview { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .grid { grid-template-columns: 1fr; }
    }
    @media (max-width: 620px) {
      .shell { width: min(100% - 24px, 1440px); padding-top: 18px; }
      header { align-items: flex-start; flex-direction: column; }
      .overview { grid-template-columns: 1fr; }
      .header-actions { width: 100%; justify-content: space-between; }
      .panel-head { align-items: flex-start; flex-direction: column; }
      .input { width: 100%; }
      .filters { width: 100%; }
    }
  </style>
</head>
<body>
  <main class="shell">
    <header>
      <div class="brand">
        <div class="mark">L</div>
        <div>
          <h1>Luna Local · MCP 观察台</h1>
          <p class="subtitle">本地 Agent 能力的权限、恢复、健康状态与操作审计</p>
        </div>
      </div>
      <div class="header-actions">
        <span class="live"><span id="liveDot" class="dot"></span><span id="liveText">正在连接</span></span>
        <button id="refreshButton" class="button" type="button">立即刷新</button>
      </div>
    </header>

    <section class="overview" aria-label="运行概览">
      <article class="card">
        <div class="eyebrow">MCP Server</div>
        <div id="serverState" class="metric">—</div>
        <div id="serverHint" class="hint">读取状态中</div>
      </article>
      <article class="card">
        <div class="eyebrow">Secure Tunnel</div>
        <div id="tunnelState" class="metric">—</div>
        <div id="tunnelHint" class="hint">读取状态中</div>
      </article>
      <article class="card">
        <div class="eyebrow">累计操作</div>
        <div id="totalCount" class="metric">0</div>
        <div id="countHint" class="hint">成功 0 · 拒绝 0 · 失败 0</div>
      </article>
      <article class="card">
        <div class="eyebrow">允许目录</div>
        <div id="workspace" class="metric small">—</div>
        <div id="workspaceHint" class="hint">仅限此目录</div>
      </article>
    </section>

    <section class="grid">
      <div class="stack">
        <article class="panel">
          <div class="panel-head"><h2>操作权限</h2><span class="hint">按细粒度 Action 即时生效</span></div>
          <div id="permissions" class="panel-body"><div class="empty">正在加载权限</div></div>
        </article>

        <article class="panel">
          <div class="panel-head"><h2>安全边界</h2></div>
          <div class="panel-body">
            <dl id="policy" class="policy-list"></dl>
          </div>
        </article>

        <article class="panel">
          <div class="panel-head"><h2>执行审批</h2><span id="approvalBadge" class="tag write">观察模式</span></div>
          <div id="approvalPanel" class="panel-body"><div class="empty">正在加载审批状态</div></div>
        </article>
      </div>

      <article class="panel">
        <div class="panel-head">
          <h2>操作日志</h2>
          <div class="filters">
            <select id="statusFilter" class="select" aria-label="按状态筛选">
              <option value="all">全部状态</option>
              <option value="success">成功</option>
              <option value="denied">已拒绝</option>
              <option value="error">失败</option>
            </select>
            <input id="searchInput" class="input" type="search" placeholder="搜索工具或路径" aria-label="搜索日志">
          </div>
        </div>
        <div class="table-wrap">
          <table>
            <thead><tr><th>时间</th><th>状态</th><th>工具</th><th>路径</th><th>详情</th><th>耗时</th></tr></thead>
            <tbody id="logRows"></tbody>
          </table>
          <div id="emptyLogs" class="empty" hidden>暂无符合条件的操作日志</div>
        </div>
      </article>
    </section>
  </main>

  <script>
    const state = { status: null, events: [], approvals: { enabled: false, pending: [], recent: [] } };
    const $ = (id) => document.getElementById(id);
    const escapeHtml = (value) => String(value ?? "")
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;")
      .replaceAll("'", "&#039;");

    function formatBytes(bytes) {
      if (bytes < 1024) return `${bytes} B`;
      if (bytes < 1024 * 1024) return `${(bytes / 1024).toFixed(1)} KiB`;
      return `${(bytes / 1024 / 1024).toFixed(1)} MiB`;
    }

    function formatTime(timestamp) {
      return new Intl.DateTimeFormat("zh-CN", {
        month: "2-digit", day: "2-digit", hour: "2-digit", minute: "2-digit", second: "2-digit", hour12: false
      }).format(new Date(timestamp));
    }

    function renderStatus() {
      const data = state.status;
      if (!data) return;
      $("serverState").textContent = data.server.ready ? "运行中" : "离线";
      $("serverState").style.color = data.server.ready ? "var(--green)" : "var(--red)";
      $("serverHint").textContent = data.server.endpoint;
      $("tunnelState").textContent = data.tunnel.ready ? "已连接" : "未就绪";
      $("tunnelState").style.color = data.tunnel.ready ? "var(--green)" : "var(--amber)";
      $("tunnelHint").textContent = data.tunnel.ready ? `Ready · HTTP ${data.tunnel.statusCode}` : "等待 Tunnel 健康检查";
      $("totalCount").textContent = data.counts.total;
      $("countHint").textContent = `成功 ${data.counts.success} · 拒绝 ${data.counts.denied} · 失败 ${data.counts.error}`;
      $("workspace").textContent = data.policy.workspaceRoot;
      $("liveText").textContent = data.server.ready && data.tunnel.ready ? "链路正常" : "部分服务未就绪";
      $("liveDot").classList.toggle("ok", data.server.ready && data.tunnel.ready);

      $("permissions").innerHTML = data.actions.map((permission) => `
        <div class="permission">
          <div>
            <div class="permission-name">${escapeHtml(permission.label)}<span class="tag ${permission.level === "write" ? "write" : ["execute", "delete", "network"].includes(permission.level) ? "execute" : ""}">${escapeHtml(permission.level)}</span></div>
            <div class="permission-meta">${escapeHtml(permission.id)} · ${escapeHtml(permission.publicTool)}(${escapeHtml(permission.operation)})</div>
          </div>
          <button class="button toggle ${permission.enabled ? "on" : "off"}" type="button" data-action="${escapeHtml(permission.id)}" data-enabled="${permission.enabled}">
            ${permission.enabled ? "已启用" : "已禁用"}
          </button>
        </div>`).join("");

      $("policy").innerHTML = `
        <div class="policy-row"><dt>绑定地址</dt><dd>${escapeHtml(data.server.endpoint)}</dd></div>
        <div class="policy-row"><dt>最大文件</dt><dd>${formatBytes(data.policy.maxFileBytes)}</dd></div>
        <div class="policy-row"><dt>Artifact 上限</dt><dd>${formatBytes(data.policy.maxArtifactBytes)}</dd></div>
        <div class="policy-row"><dt>递归操作上限</dt><dd>${escapeHtml(data.policy.maxOperationEntries)} 个条目</dd></div>
        <div class="policy-row"><dt>绝对路径</dt><dd>${data.policy.absolutePaths ? "允许" : "拒绝"}</dd></div>
        <div class="policy-row"><dt>符号链接</dt><dd>${data.policy.symbolicLinks ? "允许" : "拒绝"}</dd></div>
        <div class="policy-row"><dt>恢复后端</dt><dd>${escapeHtml(data.policy.checkpointBackend)}</dd></div>
        <div class="policy-row"><dt>恢复点上限</dt><dd>${escapeHtml(data.policy.maxCheckpoints)} 个 · 单点 ${formatBytes(data.policy.maxCheckpointBytes)}</dd></div>
        <div class="policy-row"><dt>审批模式</dt><dd>${data.approval.enabled ? `受保护的写入、恢复和命令需在 ${data.approval.timeoutSeconds} 秒内审批` : "观察模式（不阻塞操作）"}</dd></div>`;
    }

    function renderApprovals() {
      const approvals = state.approvals;
      $("approvalBadge").textContent = approvals.enabled ? `待审批 ${approvals.pending.length}` : "观察模式";
      $("approvalBadge").className = `tag ${approvals.enabled ? "execute" : "write"}`;
      const pendingHtml = approvals.pending.length
        ? `<div class="approval-list">${approvals.pending.map((approval) => `
            <div class="approval-item">
              <div class="permission-name">${escapeHtml(approval.action)}</div>
              <div class="approval-summary">${escapeHtml(approval.summary)}</div>
              <div class="approval-actions">
                <button class="button approve" type="button" data-approval-id="${escapeHtml(approval.id)}" data-decision="approve">允许</button>
                <button class="button deny" type="button" data-approval-id="${escapeHtml(approval.id)}" data-decision="deny">拒绝</button>
              </div>
            </div>`).join("")}</div>`
        : `<p>${approvals.enabled ? "当前没有等待处理的请求。" : "启用后，受保护的写入、恢复、删除恢复点和命令执行会先在这里等待你的决定。"}</p>`;

      $("approvalPanel").innerHTML = `
        <div class="approval">
          <div class="approval-top">
            <strong>${approvals.enabled ? "审批模式已启用" : "当前为观察模式"}</strong>
            <button class="button ${approvals.enabled ? "deny" : "approve"}" type="button" data-approval-policy="${!approvals.enabled}">
              ${approvals.enabled ? "关闭审批" : "启用审批"}
            </button>
          </div>
          ${pendingHtml}
        </div>`;
    }

    function renderLogs() {
      const status = $("statusFilter").value;
      const query = $("searchInput").value.trim().toLowerCase();
      const events = state.events.filter((event) => {
        if (status !== "all" && event.status !== status) return false;
        if (!query) return true;
        return `${event.tool} ${event.path}`.toLowerCase().includes(query);
      });

      $("logRows").innerHTML = events.map((event) => `
        <tr>
          <td>${escapeHtml(formatTime(event.timestamp))}</td>
          <td><span class="status ${escapeHtml(event.status)}">${escapeHtml(event.status)}</span></td>
          <td>${escapeHtml(event.tool)}</td>
          <td class="path">${escapeHtml(event.path || "—")}</td>
          <td class="details">${escapeHtml(JSON.stringify(event.details || {}))}</td>
          <td>${escapeHtml(event.durationMs)} ms</td>
        </tr>`).join("");
      $("emptyLogs").hidden = events.length > 0;
    }

    async function refresh() {
      try {
        const [statusResponse, logsResponse, approvalsResponse] = await Promise.all([
          fetch("/admin/api/status", { cache: "no-store" }),
          fetch("/admin/api/logs?limit=200", { cache: "no-store" }),
          fetch("/admin/api/approvals", { cache: "no-store" })
        ]);
        if (!statusResponse.ok || !logsResponse.ok || !approvalsResponse.ok) throw new Error("Request failed");
        state.status = await statusResponse.json();
        state.events = (await logsResponse.json()).events;
        state.approvals = await approvalsResponse.json();
        renderStatus();
        renderApprovals();
        renderLogs();
      } catch {
        $("liveText").textContent = "观察页连接中断";
        $("liveDot").classList.remove("ok");
      }
    }

    $("permissions").addEventListener("click", async (event) => {
      const button = event.target.closest("button[data-action]");
      if (!button) return;
      button.disabled = true;
      const enabled = button.dataset.enabled !== "true";
      try {
        const response = await fetch(`/admin/api/actions/${encodeURIComponent(button.dataset.action)}`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ enabled })
        });
        if (!response.ok) throw new Error("Permission update failed");
        await refresh();
      } finally {
        button.disabled = false;
      }
    });

    $("approvalPanel").addEventListener("click", async (event) => {
      const policyButton = event.target.closest("button[data-approval-policy]");
      const decisionButton = event.target.closest("button[data-approval-id]");
      const button = policyButton || decisionButton;
      if (!button) return;
      button.disabled = true;
      try {
        const response = policyButton
          ? await fetch("/admin/api/approval-policy", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ enabled: policyButton.dataset.approvalPolicy === "true" })
            })
          : await fetch(`/admin/api/approvals/${encodeURIComponent(decisionButton.dataset.approvalId)}`, {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ decision: decisionButton.dataset.decision })
            });
        if (!response.ok) throw new Error("Approval update failed");
        await refresh();
      } finally {
        button.disabled = false;
      }
    });

    $("refreshButton").addEventListener("click", refresh);
    $("statusFilter").addEventListener("change", renderLogs);
    $("searchInput").addEventListener("input", renderLogs);
    refresh();
    setInterval(refresh, 1800);
  </script>
</body>
</html>
